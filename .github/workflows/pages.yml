name: Test and deploy GitHub Pages

on:
  # Test every push to every branch.
  push:

  # Test pull requests whose destination is main.
  pull_request:
    branches:
      - main

  # Allow the workflow to be started manually.
  workflow_dispatch:

# Default permissions for all jobs.
permissions:
  contents: read

jobs:
  test:
    name: Test all 8,000 combinations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to GitHub Pages

    # Deployment cannot begin unless the test job succeeds.
    needs: test

    # Deploy only from main, never from a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js codes.js .nojekyll _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4